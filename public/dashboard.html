<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SAAA Dashboard</title>
  <link rel="icon" type="image/png" href="saaa-logo.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-theme="dark">
  <div class="sky-clouds"></div>
  <div class="aircraft aircraft-1">✈</div>
  <div class="aircraft aircraft-2">✈</div>
  <div class="aircraft aircraft-3">✈</div>
  <div class="radar"></div>
  <div class="horizon"></div>

  <div id="toastContainer" class="toast-container"></div>

  <header class="topbar">
    <div class="brand">
      <img src="saaa-logo.png" alt="SAAA" class="brand-logo" onerror="this.style.display='none'">
      <div class="brand-text">
        <span class="brand-title">San Andreas Aviation</span>
        <span class="brand-subtitle">Flight Tracker</span>
      </div>
      <span class="n-number">N172SA</span>
    </div>

    <div class="topbar-center">
      <div class="status-lights" title="COM / NAV / XPDR">
        <span class="light light-com" title="COM"></span>
        <span class="light light-nav" title="NAV"></span>
        <span class="light light-xpdr" title="XPDR"></span>
      </div>
      <div class="wind-indicator" title="Wind: 270° at 8 kts">
        <span class="wind-arrow">↑</span>
        <span class="wind-label">270° / 08</span>
      </div>
      <div class="utc-clock" id="utcClock">--:--:--Z</div>
    </div>

    <div class="user-info">
      <button id="themeToggle" class="theme-toggle" title="Toggle theme">🌙</button>
      <span id="userName"></span>
      <span id="userRole" class="badge"></span>
      <button id="logoutBtn" class="btn-secondary">Log out</button>
    </div>
  </header>

  <div class="breadcrumb-strip">
    <a href="#section-dashboard" class="breadcrumb-item active" data-target="section-dashboard">◈ Dashboard</a>
    <span class="breadcrumb-sep">·</span>
    <a href="#section-flights" class="breadcrumb-item" data-target="section-flights">Flights</a>
    <span class="breadcrumb-sep">·</span>
    <a href="#section-mylog" class="breadcrumb-item" data-target="section-mylog">My Log</a>
    <span class="breadcrumb-sep" id="allLogsSep" style="display:none;">·</span>
    <a href="#section-alllogs" class="breadcrumb-item" data-target="section-alllogs" id="allLogsCrumb" style="display:none;">All Logs</a>
    <span class="breadcrumb-sep">·</span>
    <a href="#section-materials" class="breadcrumb-item" data-target="section-materials">Materials</a>
    <span class="breadcrumb-right" id="clockRight">UTC --:--:--</span>
  </div>

  <main class="container">
    <div id="message" class="message"></div>

    <section class="card admin-only" id="section-dashboard" style="display:none;">
      <h2>Dashboard</h2>
      <div id="stats" class="stats-grid"></div>
    </section>

    <section class="card" id="onlineUsersCard" style="display:none;">
      <h2>Online Users <small id="onlineCount"></small></h2>
      <div id="onlineUsers"></div>
    </section>

    <section class="card instructor-only" style="display:none;">
      <h2>Create User</h2>
      <form id="createUserForm">
        <div class="field-row">
          <div class="field"><label>Username</label><input type="text" id="newUsername" required></div>
          <div class="field"><label>Password</label><input type="password" id="newPassword" required minlength="6"></div>
          <div class="field">
            <label>Role</label>
            <select id="newRole">
              <option value="student">Student</option>
              <option value="instructor">Instructor</option>
            </select>
          </div>
        </div>
        <div class="field-row">
          <div class="field"><label>Full Name</label><input type="text" id="newFullName" required></div>
          <div class="field"><label>Email</label><input type="email" id="newEmail"></div>
          <div class="field"><label>Phone</label><input type="text" id="newPhone"></div>
        </div>
        <button type="submit">Create User</button>
      </form>
    </section>

    <section class="card instructor-only" style="display:none;">
      <h2>Users</h2>
      <button id="refreshUsers" class="btn-secondary">Refresh</button>
      <div id="usersList"></div>
    </section>

    <section class="card" id="section-flights">
      <h2>Flight Stopwatch</h2>

      <div class="field" id="selfLogField" style="display:none;">
        <label style="display:flex; align-items:center; gap:8px; cursor:pointer;">
          <input type="checkbox" id="selfLogCheck" style="width:auto; margin:0;">
          <span>Log my own flight (self-log)</span>
        </label>
      </div>

      <div class="field-row">
        <div class="field">
          <label>Student ID</label>
          <input type="number" id="flightStudentId" required>
        </div>
        <div class="field" id="instructorSelectField">
          <label>Instructor</label>
          <select id="flightInstructorId">
            <option value="">— No instructor —</option>
          </select>
        </div>
        <div class="field">
          <label>Aircraft</label>
          <input type="text" id="flightAircraft" placeholder="N12345">
        </div>
        <div class="field">
          <label>Flight Type</label>
          <input type="text" id="flightType" placeholder="Training">
        </div>
      </div>

      <div class="field">
        <label>Notes (weather, maneuvers, remarks)</label>
        <textarea id="flightNotes" rows="2" placeholder="e.g., CAVOK, steep turns, slow flight..."></textarea>
      </div>

      <div id="stopwatchDisplay" class="stopwatch">00:00:00</div>
      <div class="stopwatch-controls">
        <button id="startFlightBtn">Start Flight</button>
        <button id="stopFlightBtn" class="btn-danger" disabled>Stop Flight</button>
      </div>
      <p id="activeSession" class="muted"></p>
    </section>

    <section class="card" id="section-mylog">
      <h2>My Flight Log</h2>
      <div class="log-actions">
        <button id="refreshMyLog" class="btn-secondary">Refresh</button>
        <button id="printLogbook" class="btn-secondary">Print Logbook</button>
      </div>
      <div id="myLogList"></div>
    </section>

    <section class="card admin-only" id="section-alllogs" style="display:none;">
      <h2>All Flight Logs</h2>
      <div class="log-actions">
        <button id="refreshAllLogs" class="btn-secondary">Refresh</button>
        <button id="exportCsv" class="btn-secondary">Export CSV</button>
      </div>
      <div class="filter-bar">
        <input type="text" id="filterPilot" placeholder="Filter by pilot name...">
        <input type="text" id="filterInstructor" placeholder="Filter by instructor...">
        <input type="date" id="filterFrom" title="From date">
        <input type="date" id="filterTo" title="To date">
        <button id="clearFilters" class="btn-secondary btn-small">Clear</button>
      </div>
      <div id="allLogsList"></div>
    </section>

    <section class="card" id="section-materials">
      <h2>Study Materials</h2>
      <div id="uploadPanel" class="instructor-only" style="display:none;">
        <form id="uploadForm">
          <div class="field-row">
            <div class="field"><label>Title</label><input type="text" id="matTitle" required></div>
            <div class="field"><label>Category</label><input type="text" id="matCategory" placeholder="Ground School"></div>
          </div>
          <div class="field"><label>Description</label><input type="text" id="matDescription"></div>
          <div class="field"><label>File</label><input type="file" id="matFile" required></div>
          <button type="submit">Upload</button>
        </form>
      </div>
      <button id="refreshMaterials" class="btn-secondary">Refresh</button>
      <div id="materialsList"></div>
    </section>
  </main>

  <div id="progressModal" class="modal-backdrop" style="display:none;">
    <div class="modal">
      <div class="modal-header">
        <h3 id="progressTitle">Student Progress</h3>
        <button class="modal-close" onclick="closeProgressModal()">×</button>
      </div>
      <div id="progressBody" class="modal-body"></div>
    </div>
  </div>

  <div id="editModal" class="modal-backdrop" style="display:none;">
    <div class="modal">
      <div class="modal-header">
        <h3>Edit Flight Session</h3>
        <button class="modal-close" onclick="closeEditModal()">×</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="editSessionId">
        <div class="field"><label>Date / Time</label><input type="text" id="editDateTime" readonly></div>
        <div class="field"><label>Aircraft</label><input type="text" id="editAircraft"></div>
        <div class="field"><label>Flight Type</label><input type="text" id="editType"></div>
        <div class="field"><label>Duration (hours)</label><input type="number" id="editDuration" step="0.01" min="0"></div>
        <div class="field"><label>Notes</label><textarea id="editNotes" rows="3"></textarea></div>
        <div class="modal-actions">
          <button class="btn-secondary" onclick="closeEditModal()">Cancel</button>
          <button onclick="saveEditSession()">Save</button>
        </div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
  <script>initDashboard();</script>
</body>
</html>
