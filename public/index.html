<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>San Andreas Aviation Administration</title>
  <link rel="icon" type="image/png" href="saaa-logo.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <div class="card">
      <img src="saaa-logo.png" alt="SAAA" class="login-logo" onerror="this.style.display='none'">
      <h1>San Andreas Aviation Administration</h1>
      <p class="subtitle">Sign in to your flight tracker</p>

      <form id="loginForm">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" required autocomplete="username">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
        <button type="submit" style="width:100%;">Sign In</button>
      </form>

      <div id="setupPanel" style="display:none;">
        <hr>
        <h2>First-Time Setup</h2>
        <p class="muted">No admin account exists yet. Create one now.</p>
        <form id="setupForm">
          <div class="field"><label>Username</label><input type="text" id="setupUsername" required></div>
          <div class="field"><label>Password</label><input type="password" id="setupPassword" required minlength="6"></div>
          <div class="field"><label>Full Name</label><input type="text" id="setupFullName" required></div>
          <div class="field"><label>Email</label><input type="email" id="setupEmail"></div>
          <button type="submit" style="width:100%;">Create Admin Account</button>
        </form>
      </div>

      <div id="message" class="message"></div>
    </div>
  </div>
  <script src="app.js"></script>
  <script>initLoginPage();</script>
</body>
</html>
