<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>San Andreas Aviation Administration</title>
  <link rel="icon" type="image/png" href="saaa-logo.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="sky-clouds"></div>
  <div class="aircraft aircraft-1">✈</div>
  <div class="aircraft aircraft-2">✈</div>
  <div class="aircraft aircraft-3">✈</div>
  <div class="radar"></div>
  <div class="horizon"></div>

  <div class="container">
    <div class="card">
      <img src="saaa-logo.png" alt="SAAA" class="login-logo" onerror="this.style.display='none'">
      <h1>San Andreas Aviation Administration</h1>
      <p class="subtitle">Sign in to your flight tracker</p>

      <div id="errorBanner" class="message error" style="display:none;"></div>

      <form id="loginForm">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" required autocomplete="username">
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password">
        </div>
        <button type="submit" style="width:100%;">Sign In</button>
      </form>

      <div id="discordPanel" style="display:none;">
        <div class="divider"><span>or</span></div>
        <a href="/api/auth/discord" class="discord-btn">
          <svg class="discord-logo" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path fill="currentColor" d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.074.074 0 0 0-.079.037c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.077.077 0 0 0-.079-.037A19.736 19.736 0 0 0 3.677 4.37a.07.07 0 0 0-.032.027C.533 9.046-.32 13.58.099 18.057a.082.082 0 0 0 .031.057 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028c.462-.63.874-1.295 1.226-1.994a.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.299 12.299 0 0 1-1.873.892.077.077 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.839 19.839 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.674-3.549-13.66a.061.061 0 0 0-.031-.03zM8.02 15.331c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.956-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.956 2.418-2.157 2.418zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.419 2.157-2.419 1.21 0 2.176 1.096 2.157 2.42 0 1.333-.946 2.418-2.157 2.418z"/>
          </svg>
          Continue with Discord (GTAW)
        </a>
      </div>

      <div id="gtawPanel" style="display:none;">
        <div class="divider"><span>or</span></div>
        <a href="/api/auth/gtaw" class="gtaw-btn">
          <span class="gtaw-icon">🎮</span>
          Continue with GTA World
        </a>
      </div>

      <div id="setupPanel" style="display:none;">
        <hr>
        <h2>First-Time Setup</h2>
        <p class="muted">No admin account exists yet. Create one now.</p>
        <form id="setupForm">
          <div class="field">
            <label for="setupUsername">Username</label>
            <input type="text" id="setupUsername" required>
          </div>
          <div class="field">
            <label for="setupPassword">Password</label>
            <input type="password" id="setupPassword" required minlength="6">
          </div>
          <div class="field">
            <label for="setupFullName">Full Name</label>
            <input type="text" id="setupFullName" required>
          </div>
          <div class="field">
            <label for="setupEmail">Email</label>
            <input type="email" id="setupEmail">
          </div>
          <button type="submit" style="width:100%;">Create Admin Account</button>
        </form>
      </div>

      <div id="message" class="message"></div>
    </div>
  </div>
  <script src="app.js"></script>
  <script>initLoginPage();</script>
</body>
</html>
