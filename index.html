<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Flight School Dashboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✈️</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>✈️ Flight School Dashboard</h1>
      <div class="tag">Roster · Teaching Materials · Flight Hour Stopwatch</div>
    </div>
  </header>

  <nav>
    <button data-tab="roster" class="active">Roster</button>
    <button data-tab="materials">Materials</button>
    <button data-tab="stopwatch">Stopwatch</button>
  </nav>

  <div id="tab-roster"></div>
  <div id="tab-materials" style="display:none"></div>
  <div id="tab-stopwatch" style="display:none"></div>
</div>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
