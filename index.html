<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>San Andreas Aviation Administration — Flight School Dashboard</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap" id="loginScreen" style="display:none">
  <header><div class="brand"><img src="logo.png" alt="San Andreas Aviation Administration" class="logo"><h1>Flight School Dashboard</h1></div></header>
  <div class="card" style="max-width:380px;margin:40px auto">
    <h2 id="loginTitle">Sign in</h2>
    <div class="field" style="margin-bottom:10px"><label class="small">Username</label><input id="loginUser"></div>
    <div class="field" style="margin-bottom:14px"><label class="small">Password</label><input id="loginPass" type="password"></div>
    <button class="btn" style="width:100%" onclick="handleLogin()">Sign in</button>
    <div class="empty" id="loginError" style="display:none;color:var(--danger)"></div>
  </div>
</div>

<div class="wrap" id="appScreen" style="display:none">
  <header>
    <div class="brand">
      <img src="logo.png" alt="San Andreas Aviation Administration" class="logo">
      <div>
        <h1>Flight School Dashboard</h1>
        <div class="tag" id="whoami"></div>
      </div>
    </div>
    <div class="row" style="align-items:center">
      <span class="pill online-badge" id="onlineBadge">● connecting…</span>
      <button class="btn secondary" onclick="logout()">Log out</button>
    </div>
  </header>

  <nav>
    <button data-tab="roster" class="active">Roster</button>
    <button data-tab="materials">Materials</button>
    <button data-tab="stopwatch">Stopwatch</button>
    <button data-tab="users">Users</button>
  </nav>

  <div id="tab-roster"></div>
  <div id="tab-materials" style="display:none"></div>
  <div id="tab-stopwatch" style="display:none"></div>
  <div id="tab-users" style="display:none"></div>
</div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-database-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="presence.js"></script>
<script src="auth.js"></script>
<script src="app.js"></script>
</body>
</html>
